  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The HCDP portal's webfonts, from Google Fonts as the portal loads them: Raleway (its top navigation, 600, and the
         weights its pages' blocks use), Open Sans (its post titles) and Roboto 300/400/500 (its climate viewer and our map
         furniture). Declared on the document so the mirrored pages' shadow roots can use them (CONTRACT.md "Mirrored pages").
         Body text and headings use the portal's system font stack: nothing to download. -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Raleway:wght@400;500;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
