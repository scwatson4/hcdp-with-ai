<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- G4: the official HCDP mark (hawaii.edu/climate-data-portal favicon,
       embedded verbatim) over the app's rainbow hairline, with "AI"
       beneath. Theme-aware: the chip follows the browser's color scheme. -->
  <style>
    .chip { fill: #ffffff; stroke: #d9d6cd; }
    .ai   { fill: #1c1c1e; }
    @media (prefers-color-scheme: dark) {
      .chip { fill: #15151a; stroke: #3a3a42; }
      .ai   { fill: #ececef; }
    }
  </style>
  <defs><linearGradient id="rb" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#e5484d"/><stop offset="0.17" stop-color="#e5a13c"/><stop offset="0.33" stop-color="#e2c94f"/><stop offset="0.50" stop-color="#46a758"/><stop offset="0.67" stop-color="#3f9ecf"/><stop offset="0.83" stop-color="#6f6bc5"/><stop offset="1.00" stop-color="#b658c4"/></linearGradient></defs>
  <rect class="chip" width="32" height="32" rx="7" stroke-width="1"/>
  <image href="data:image/png;base64," x="4" y="5" width="24" height="6.1"/>
  <rect x="6" y="14.5" width="20" height="1.6" rx="0.8" fill="url(#rb)"/>
  <text x="16" y="28.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="12" class="ai">AI</text>
</svg>